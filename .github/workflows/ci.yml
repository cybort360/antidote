name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Security · Types · Tests · Packages · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run verify:deployment
      - run: npm run sdk:pack:check
      - run: npm run build

  release-verify:
    name: Release verification matrix
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start the app
        run: |
          nohup npm run start -- --port 3000 > /tmp/antidote.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/health > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:3000/api/health || (cat /tmp/antidote.log && exit 1)
      - name: Run the release verification matrix
        run: BASE_URL=http://localhost:3000 node scripts/verify-release.mjs
      - name: Run the API smoke test
        run: BASE_URL=http://localhost:3000 node scripts/smoke-demo.mjs
      - name: Run the labeled screening quality gate
        run: BASE_URL=http://localhost:3000 npm run evaluate:screening
