name: Release TypeScript SDK

on:
  workflow_dispatch:

jobs:
  publish:
    name: Verify and publish SDK
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm test -- tests/sdk.test.ts
      - run: npm run sdk:pack:check
      - name: Publish public package
        run: npm publish ./sdk --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
